name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp]"
      - run: pytest
      - run: python scripts/validate_bundle.py
      - run: python -m compileall -q src skills scripts
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$VERSION" = "${GITHUB_REF_NAME}"
      - run: python scripts/build_distributions.py
      - run: python scripts/generate_checksums.py dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --generate-notes \
            --verify-tag \
            --title "AI Image Studio ${GITHUB_REF_NAME}"
