name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Analisis estatico. El conjunto de reglas esta acotado en pyproject.toml: busca
  # defectos reales, no impone estilo.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .

  # Suite de pruebas en los tres sistemas operativos y en todas las versiones
  # de Python soportadas. Linux cubre la matriz completa; Windows y macOS
  # cubren los extremos, que es donde aparecen las diferencias de plataforma.
  test:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp]"

      - name: Comprobar que MCP resolvio a una version compatible
        shell: bash
        run: |
          python -c "
          from importlib.metadata import version
          v = version('mcp')
          major, minor = (int(p) for p in v.split('.')[:2])
          assert major == 1 and minor >= 14, f'mcp {v} fuera del intervalo soportado'
          print(f'mcp {v}: dentro de >=1.14,<2')
          "

      - name: Importar FastMCP y construir el servidor MCP
        run: |
          python -c "
          from mcp.server.fastmcp import FastMCP
          from ai_image_studio.mcp_server import build_server
          s = build_server()
          print('servidor MCP construido con', len(s._tool_manager.list_tools()), 'herramientas')
          "

      # La salida va FUERA del repositorio: contiene rutas de la maquina y, si se
      # escribe en el arbol, el escaneo de privacidad aborta despues la construccion
      # de los artefactos y tumba la suite entera.
      - name: doctor debe declarar la capacidad MCP operativa
        shell: bash
        run: |
          ai-image-studio doctor > "$RUNNER_TEMP/doctor.json"
          python -c "
          import json, os
          d = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'doctor.json')))
          assert d['mcp']['state'] == 'ok', d['mcp']
          assert d['ready'] is True, d['critical_failures']
          print('doctor: ready=True, mcp.state=ok')
          "

      - run: pytest
      - run: python scripts/validate_bundle.py
      - run: python -m compileall -q src skills scripts

  # doctor no puede declarar 'ready' cuando MCP esta instalado pero inservible.
  mcp-incompatible:
    name: doctor detecta MCP incompatible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Instalar a la fuerza una version incompatible
        run: pip install "mcp==2.0.0"
      - name: doctor debe fallar con ready=false
        run: |
          ai-image-studio doctor > "$RUNNER_TEMP/doctor.json" || true
          python -c "
          import json, os
          d = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'doctor.json')))
          assert d['mcp']['state'] == 'incompatible', d['mcp']
          assert d['ready'] is False, 'ready no puede ser true con MCP inservible'
          print('correcto: state=incompatible, ready=False')
          "
      - name: La suite debe fallar con una version incompatible
        run: |
          if pytest tests/test_mcp_dependency.py -q; then
            echo "ERROR: las pruebas pasaron con mcp 2.0.0"; exit 1
          fi
          echo "correcto: la suite detecta la version incompatible"

  # Los artefactos se validan como productos independientes, no solo el repositorio.
  artifacts:
    name: Artefactos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,mcp]"
      - run: python scripts/build_distributions.py
        env:
          # Terminos privados adicionales a vetar (nombres de clientes, etc.).
          # Se define como variable del repositorio para no escribirlos aqui.
          AI_IMAGE_STUDIO_PRIVATE_TERMS: ${{ vars.AI_IMAGE_STUDIO_PRIVATE_TERMS }}
      - run: python scripts/generate_checksums.py dist
      - name: Validar los cuatro ZIP
        env:
          AI_IMAGE_STUDIO_PRIVATE_TERMS: ${{ vars.AI_IMAGE_STUDIO_PRIVATE_TERMS }}
        run: python scripts/validate_artifacts.py dist
      - name: Pruebas de artefactos y de instalador
        run: pytest tests/test_artifacts.py tests/test_installer_safety.py -q
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: distribution-preview
          path: dist/

  # Validacion con la herramienta real de Claude Code. La instalacion puede fallar
  # por causas ajenas al proyecto; en ese caso el paso se marca y la comprobacion
  # estructural equivalente de validate_artifacts.py sigue siendo obligatoria.
  claude-plugin:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - id: install
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Validar manifiestos del repositorio
        if: steps.install.outcome == 'success'
        run: claude plugin validate . --strict
      - name: Validar el artefacto extraido
        if: steps.install.outcome == 'success'
        run: |
          sudo apt-get install -y unzip >/dev/null
          python -m pip install --upgrade pip >/dev/null
          pip install -e ".[dev]" >/dev/null
          python scripts/build_distributions.py
          mkdir -p /tmp/claude-artifact
          unzip -q dist/ai-image-studio-claude-plugin-*.zip -d /tmp/claude-artifact
          claude plugin validate /tmp/claude-artifact/ai-image-studio --strict
      - name: Instalar y desinstalar en configuracion aislada
        if: steps.install.outcome == 'success'
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-config-aislada
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add /tmp/claude-artifact/ai-image-studio
          claude plugin install ai-image-studio@ai-image-studio-marketplace
          claude plugin details ai-image-studio@ai-image-studio-marketplace | tee detalles.txt
          grep -q "Skills (6)" detalles.txt || { echo "no se detectaron las seis skills"; exit 1; }
          claude plugin uninstall ai-image-studio@ai-image-studio-marketplace
          claude plugin marketplace remove ai-image-studio-marketplace
          claude plugin list | grep -qi "No plugins installed" || { echo "rollback incompleto"; exit 1; }
      - name: Aviso si la herramienta no pudo instalarse
        if: steps.install.outcome != 'success'
        run: |
          echo "::warning::No se pudo instalar el CLI de Claude Code."
          echo "::warning::La validacion estructural de scripts/validate_artifacts.py sigue cubriendo el manifiesto."

  # Comportamiento real del instalador de skills en PowerShell.
  installer-windows:
    name: Instalador de skills (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalacion limpia
        shell: pwsh
        run: |
          .\adapters\install-skills.ps1 -Target project-claude -ProjectRoot "$env:RUNNER_TEMP\proyecto"
          if ($LASTEXITCODE -ne 0) { throw "instalacion limpia fallida ($LASTEXITCODE)" }
          $n = (Get-ChildItem "$env:RUNNER_TEMP\proyecto\.claude\skills" -Directory).Count
          if ($n -ne 6) { throw "se esperaban 6 skills, hay $n" }
      - name: Sin -Force no se sustituye nada
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\proyecto\.claude\skills"
          $marca = "$dest\image-intake-router\DEL_USUARIO.txt"
          Set-Content -Path $marca -Value "contenido del usuario"
          .\adapters\install-skills.ps1 -Target project-claude -ProjectRoot "$env:RUNNER_TEMP\proyecto"
          if ($LASTEXITCODE -ne 3) { throw "se esperaba codigo 3, se obtuvo $LASTEXITCODE" }
          if (-not (Test-Path $marca)) { throw "se borro contenido del usuario sin -Force" }
      - name: -WhatIf no escribe
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\proyecto\.claude\skills"
          $antes = (Get-ChildItem $dest -Recurse -File).Count
          .\adapters\install-skills.ps1 -Target project-claude -ProjectRoot "$env:RUNNER_TEMP\proyecto" -Force -WhatIf
          $despues = (Get-ChildItem $dest -Recurse -File).Count
          if ($antes -ne $despues) { throw "-WhatIf modifico el destino" }
      - name: -Force sustituye y crea copia de seguridad
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\proyecto\.claude\skills"
          .\adapters\install-skills.ps1 -Target project-claude -ProjectRoot "$env:RUNNER_TEMP\proyecto" -Force
          if ($LASTEXITCODE -ne 0) { throw "-Force fallo ($LASTEXITCODE)" }
          $copia = Get-ChildItem "$dest\.ai-image-studio-backup" -Directory | Select-Object -Last 1
          if (-not $copia) { throw "-Force no creo copia de seguridad" }
          $guardado = Join-Path $copia.FullName "image-intake-router\DEL_USUARIO.txt"
          if (-not (Test-Path $guardado)) { throw "la copia no conserva el contenido sustituido" }
      - name: Argumentos invalidos devuelven codigo 2, igual que install-skills.sh
        shell: pwsh
        run: |
          .\adapters\install-skills.ps1 -Target destino-inventado 2>$null
          if ($LASTEXITCODE -ne 2) { throw "destino invalido: se esperaba 2, se obtuvo $LASTEXITCODE" }
          .\adapters\install-skills.ps1 2>$null
          if ($LASTEXITCODE -ne 2) { throw "sin -Target: se esperaba 2, se obtuvo $LASTEXITCODE" }

      # Los destinos globales escriben en $HOME. PowerShell fija $HOME al arrancar la
      # sesion a partir de USERPROFILE/HOMEDRIVE+HOMEPATH, asi que definir $env:HOME
      # dentro del script NO aisla nada: hay que preparar el entorno en un paso previo
      # para que el proceso del paso siguiente arranque ya redirigido.
      - name: Preparar un perfil aislado para los destinos globales
        shell: pwsh
        run: |
          $perfil = Join-Path $env:RUNNER_TEMP "perfil-aislado"
          New-Item -ItemType Directory -Force -Path $perfil | Out-Null
          "USERPROFILE=$perfil"                        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "HOMEDRIVE=$(Split-Path -Qualifier $perfil)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "HOMEPATH=$(Split-Path -NoQualifier $perfil)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Destinos globales claude y codex sobre el perfil aislado
        shell: pwsh
        run: |
          $perfil = Join-Path $env:RUNNER_TEMP "perfil-aislado"
          if ($HOME -ne $perfil) {
            throw "sin aislamiento real de HOME no se ejecuta nada. `$HOME=$HOME, esperado=$perfil"
          }
          foreach ($caso in @(@("claude", ".claude\skills"), @("codex", ".agents\skills"))) {
            .\adapters\install-skills.ps1 -Target $caso[0]
            if ($LASTEXITCODE -ne 0) { throw "-Target $($caso[0]) fallo ($LASTEXITCODE)" }
            $n = (Get-ChildItem (Join-Path $perfil $caso[1]) -Directory).Count
            if ($n -ne 6) { throw "-Target $($caso[0]): se esperaban 6 skills, hay $n" }
          }
