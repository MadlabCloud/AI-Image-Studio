name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp]"
      - run: pytest
      - run: python scripts/validate_bundle.py
      - run: python -m compileall -q src skills scripts
      - run: python scripts/build_distributions.py
      - run: python scripts/generate_checksums.py dist
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: distribution-preview
          path: dist/
